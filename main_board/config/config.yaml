active_profile: "win11_laptop"  # Switch to "pi5" when deploying to Raspberry Pi 5

profiles:
  win11_laptop:
    serial:
      port: "socket://127.0.0.1:5555"
      mock_bind_host: "127.0.0.1"
      mock_bind_port: 5555
      baudrate: 115200
      timeout_s: 0.0
    vision:
      camera_id: 0
      model_path: "data/yolov8n-pose.onnx"
      imgsz: 320
      tracking_fps: 15
      dialogue_fps: 2
    audio:
      input_device: null
      output_device: null
    compute:
      enable_core_pinning: false
      llm_threads: 4

  pi5:
    serial:
      port: "/dev/ttyAMA0"
      baudrate: 115200
      timeout_s: 0.0
    vision:
      camera_id: "/dev/video0"
      model_path: "data/yolov8n-pose_ncnn_model"
      imgsz: 320
      tracking_fps: 12
      dialogue_fps: 2
    audio:
      input_device: "plughw:CARD=Webcam,DEV=0"
      output_device: "plughw:CARD=Device,DEV=0"
    compute:
      enable_core_pinning: true
      core_map:
        io_arbiter: [0]             # Dedicated real-time core for 50Hz UART & VAD
        vision_pose: [1, 2, 3]      # Shared pool with llama-server (auto-yields at 2 FPS)
        ai_inference: [1, 2, 3]     # Persistent 3-thread pool (--threads 3)
      llm_threads: 3

cloud_verifier:
  modal_model: "QuantTrio/Qwen3-VL-30B-A3B-Instruct-AWQ"
  connect_timeout_s: 1.2            # Fast-fail to local Gemma 4 E2B if Wi-Fi is down
  read_timeout_s: 9.0               # Allows 4-6s Modal GPU snapshot cold-start + inference
  local_failover_model: "gemma-4-E2B-it-qat-Q4"
  local_failover_keyframes: 1       # Single 384x384 keyframe on offline failover

slos:
  uart_tx_hz: 50
  uart_rx_hz: 10
  fcm_heartbeat_sec: 300
  target_follow_dist_m: 1.5
  sonar_stop_cm: 20